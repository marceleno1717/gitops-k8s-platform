apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolvecm
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.mysql.serviceName | quote }}
  DB_USER: {{ .Values.mysql.user | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ivolvesecret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  DB_PASSWORD: {{ .Values.mysql.password | quote }}

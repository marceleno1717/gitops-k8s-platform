[defaults]
inventory = inventory.aws_ec2.yaml
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
roles_path = roles

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, script, auto, yaml, ini

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

---
- name: Check if Kubernetes control-plane is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadmin_init_check

- name: Initialize Kubernetes cluster with kubeadm
  command: >
    kubeadm init
    --apiserver-advertise-address={{ internal_ip }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  when: not kubeadmin_init_check.stat.exists
  register: kubeadm_init_output

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy admin.conf to user's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Deploy Flannel Pod Network CNI
  become: yes
  become_user: ubuntu
  command: kubectl apply -f {{ cni_flannel_manifest_url }}
  when: not kubeadmin_init_check.stat.exists

- name: Generate join command token for worker nodes
  command: kubeadm token create --print-join-command
  register: k8s_join_command
  changed_when: false

- name: Share join command to hostvars
  set_fact:
    cluster_join_command: "{{ k8s_join_command.stdout }}"
  delegate_to: localhost
  delegate_facts: true
